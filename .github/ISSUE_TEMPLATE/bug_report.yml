name: 🐛 Bug 反馈
description: 报告雪猫的异常行为（带完整环境信息会被优先处理）
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## 雪猫 Bug 反馈
        提交前请：
        * 搜索现有 issues，确认不重复
        * **凭据红线**：任何 QQ 号、密码、token、私钥不得出现在本帖（示例一律 <REDACTED>）
        * 带对照实验的报法最受欢迎（参考 #73：现象/排除清单/定位结论）
        * Boot 失败请附 snowcat-boot.log（无日志也请注明"未生成"，这是线索）
  - type: input
    id: system-version
    attributes: { label: 系统版本, placeholder: "Windows 11 25H2 build 26200" }
    validations: { required: true }
  - type: input
    id: qq-version
    attributes: { label: QQ 版本, placeholder: "9.9.37-54395" }
    validations: { required: true }
  - type: input
    id: snowcat-version
    attributes: { label: 雪Cat 版本/分支, placeholder: "main @ 日期 或 release 号" }
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么、期望是什么、如何复现
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: 日志/截图, description: "snowcat-boot.log / nc-boot.log / Crashpad 状态" }
  - type: textarea
    id: ruled-out
    attributes: { label: 已排除项, description: "你做过哪些对照实验排除了哪些假设" }
  - type: checkboxes
    id: charter
    attributes:
      label: 纪律确认
      options:
        - label: 我已阅读 CHARTER.md，确认本帖不含凭据、不含广告、不是套娃复读
          required: true