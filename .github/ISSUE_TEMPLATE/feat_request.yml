name: 💡 功能建议
description: 提交新功能或改进建议（说清场景与收益会被优先考虑）
title: "[FEAT] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 雪猫功能建议
        提交前请：
        * 搜索现有 issues，确认不重复
        * 说清 **使用场景** 而不只是「我想要」——场景决定优先级
        * 平台相关请标注（Windows / macOS / Linux / Docker）
  - type: textarea
    id: scenario
    attributes: { label: 使用场景, description: "你在做什么、卡在哪、这个功能怎么帮到你" }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: 目标平台, placeholder: "Windows / macOS / Linux / 全平台" }
    validations: { required: true }
  - type: textarea
    id: expect
    attributes: { label: 期望效果, description: "理想中的行为描述" }
    validations: { required: true }
  - type: checkboxes
    id: charter
    attributes:
      label: 纪律确认
      options:
        - label: 我已阅读 CHARTER.md，确认本帖不含凭据、不含广告、不是套娃复读
          required: true